services:
  - type: web
    name: peptide-encyclopedia-api
    env: python
    plan: starter
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python seed.py && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7  # pydantic-core has no prebuilt wheel for 3.14 yet; pin to avoid a source build
      - key: DATABASE_URL
        value: sqlite:////var/data/peptides.db
      - key: ADMIN_API_KEY
        sync: false  # set manually in Render dashboard, don't commit the real value
    disk:
      name: peptide-data
      mountPath: /var/data
      sizeGB: 1
