id: na-semax-amidate
name: NA Semax Amidate (N-Acetyl Semax Amidate)
status: published

category_ids:
  - cognitive

overview: >
  A dual-modified analog of Semax, bearing an N-terminal acetyl group and a C-terminal amide,
  intended to resist enzymatic degradation longer than unmodified Semax. It is marketed under
  names including "NA Semax Amidate" and "N-Acetyl Semax Amidate." No studies of this specific
  modified molecule have been published — all available pharmacology is extrapolated from
  research on its parent compound, Semax.

key_benefits:
  - Marketed as a longer-acting, more stable analog of Semax
  - Intended pharmacology (focus/cognitive support) is extrapolated entirely from Semax research, not from studies of this molecule itself

mechanism_of_action: >
  NA Semax Amidate is structurally Semax with an added N-terminal acetyl group and C-terminal
  amide, modifications intended to slow degradation by aminopeptidases and other plasma
  peptidases and thereby extend the molecule's activity relative to unmodified Semax — vendor
  material describes it as remaining intact roughly 30 minutes longer than unmodified Semax in
  stability testing. Semax itself is thought to act primarily by upregulating BDNF and its
  receptor TrkB in the hippocampus and by modulating dopaminergic and serotonergic signaling —
  see the Semax entry in this encyclopedia for that underlying research. No published study has
  directly tested whether this analog retains the same mechanism, potency, or receptor
  engagement as Semax; this is a structural rationale, not a demonstrated equivalence.

