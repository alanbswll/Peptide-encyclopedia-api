research_protocols:
  - goal: "AMPK Activation / Endurance Research"
    dose: "1–3 mg daily, subQ"
    timing: "Any consistent time, sometimes paired with exercise"
    disclaimer: "For research purposes only. Not evaluated by the FDA. Prohibited in competitive sport by WADA. Human efficacy and safety for this use case are not established."
