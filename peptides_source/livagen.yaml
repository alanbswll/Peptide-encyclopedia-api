id: livagen
name: Livagen
status: published

category_ids:
  - longevity

overview: >
  A synthetic tetrapeptide (Lys-Glu-Asp-Ala) developed by Vladimir Khavinson's group at the St.
  Petersburg Institute of Bioregulation and Gerontology as a tissue-specific "bioregulator"
  targeting liver and immune tissue, part of the same research program that produced Thymalin,
  Vilon, and Cardiogen. Livagen's supporting research comes almost entirely from
  Khavinson-affiliated studies.

key_benefits:
  - Studied for restoring age-related declines in hepatocyte protein synthesis in rat cell culture
  - Explored for chromatin decondensation in aging lymphocytes, a proposed marker of gene reactivation
  - Investigated for effects on digestive enzyme activity in aging rats

mechanism_of_action: >
  Livagen is proposed to act as a short-peptide "bioregulator" affecting gene expression in
  liver and immune tissue, similar in concept to other Khavinson-group tetrapeptides. In
  hepatocyte cultures from rats of different ages, Livagen restored the normal rhythm of protein
  synthesis that is otherwise blunted with age, with the largest effect seen in cells from old
  animals. In lymphocytes from elderly human subjects, Livagen was reported to decondense
  heterochromatin in cell nuclei, a change proposed to reflect reactivation of genes silenced by
  age-related chromatin compaction. The precise molecular target and mechanism are not
  well-characterized outside this research program.

