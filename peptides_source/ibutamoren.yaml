  - citation: "Adunsky A, Chandler J, Heyden N, et al. MK-0677 (ibutamoren mesylate) for the treatment of patients recovering from hip fracture: a multicenter, randomized, placebo-controlled phase IIb study. Arch Gerontol Geriatr. 2011;53(2):183-189."
    url: "https://doi.org/10.1016/j.archger.2010.10.004"

