research_indications:
  - TNF inhibition and reduced endothelial cell adhesion (human THP-1 monocyte/macrophage cell
    line)
  - Marketed for bronchial mucosa / lung support (manufacturer claim, alongside Bronchogen)

reconstitution_steps:
  - Reconstitute with bacteriostatic water; refrigerate.

quality_indicators:
  - "White to off-white lyophilized powder that fully dissolves into a clear solution"
  - "Third-party COA available confirming peptide identity and purity"
  - "No visible discoloration, clumping, or particulate after reconstitution"

what_to_expect: >
  There is no established human effect profile for Chonluten. Available evidence is limited to one
  in vitro human monocyte/macrophage cell-line study conducted by researchers affiliated with
  Vladimir Khavinson's institute (and co-authors at other European institutions); no human
  clinical trials or independent replications specific to bronchial tissue were found.

safety_notes: >
  Chonluten's evidence base is limited to a single in vitro cell-line study and manufacturer
  marketing claims; there is no bronchial-tissue-specific animal or human data, and no independent
  human safety or efficacy data of any kind. This is an experimental research compound with
  unverified relevance to humans, not an approved treatment for any respiratory or other
  condition. Consult a healthcare provider.

references:
