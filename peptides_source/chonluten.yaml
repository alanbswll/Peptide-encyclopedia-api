id: chonluten
name: Chonluten
status: draft

category_ids:
  - longevity                 # no respiratory/lung category exists in the lookup table; closest
                               # available fit, matching sibling organ-specific bioregulators.

overview: >
  A synthetic tripeptide from the Khavinson-school family of short "bioregulator" peptides,
  developed at the St. Petersburg Institute of Bioregulation and Gerontology and derived from
  analysis of bronchial epithelial cells, part of the same research program that produced
  Thymalin, Vilon, Cardiogen, and Livagen. It is closely related to — but marketed as a distinct
  product from — Bronchogen, the other Khavinson bronchial/lung bioregulator in this batch.
  Chonluten's supporting research comes almost entirely from Khavinson-affiliated studies.

key_benefits:
  - Studied in a human monocyte/macrophage cell line (THP-1) for inhibiting TNF production
  - Marketed by the originating institute for bronchial mucosa and lung support, alongside
    Bronchogen

aliases:
  - "Honluten"                 # direct transliteration of the Cyrillic "Хонлутен" seen on some vendor labels

mechanism_of_action: >
  Chonluten is proposed to act as a short-peptide "bioregulator" affecting gene expression in
  bronchial mucosal tissue, similar in concept to other Khavinson-group tripeptides. Russian
  manufacturer materials describe its composition as glutamic acid, aspartic acid, and glycine
  (Glu-Asp-Gly), though this was not independently confirmed against a peer-reviewed structural
  source. In a 2022 in vitro study of the human THP-1 monocyte/macrophage cell line, Chonluten was
  one of five Khavinson-group peptides tested and was reported to inhibit tumor necrosis factor
  (TNF) production and reduce cell adhesion to activated endothelial cells, alongside increased
  tyrosine phosphorylation of mitogen-activated proliferation pathways shared across the peptides
  tested. This is an immune-cell/inflammation assay rather than a bronchial-tissue-specific study.
  The precise molecular target and mechanism are not well-characterized outside this research
  program, and no human clinical trial data was found.

