id: bronchogen
name: Bronchogen
status: draft

category_ids:
  - longevity                 # no respiratory/lung category exists in the lookup table; this is the
                               # closest available fit, matching how sibling organ-specific
                               # bioregulators (Cardiogen, Livagen) were categorized. Flagged as an
                               # imperfect mapping.

overview: >
  A synthetic tetrapeptide from the Khavinson-school family of short "bioregulator" peptides,
  developed at the St. Petersburg Institute of Bioregulation and Gerontology as a tissue-specific
  preparation targeting bronchial and lung tissue, part of the same research program that produced
  Thymalin, Vilon, Cardiogen, and Livagen. Bronchogen's supporting research comes almost entirely
  from Khavinson-affiliated studies, with one notable rat model study of obstructive lung disease.

key_benefits:
  - Studied in a rat model of nitrogen-dioxide-induced obstructive lung pathology for restoring
    bronchial epithelial structure
  - Explored in organotypic lung tissue culture for stimulating reparative activity in explants
    from aged animals
  - Investigated (alongside Chonluten, a related bronchial bioregulator) as part of the broader
    Khavinson respiratory-bioregulator research line

aliases: []

mechanism_of_action: >
  Bronchogen is proposed to act as a short-peptide "bioregulator" affecting gene expression in
  bronchial and lung tissue, similar in concept to other Khavinson-group tetrapeptides. In a rat
  model of chronic obstructive lung pathology induced by nitrogen dioxide exposure, one month of
  peptide therapy was reported to reverse markers of bronchial epithelial remodeling — including
  goblet cell hyperplasia, squamous metaplasia, lymphocytic infiltration, and emphysema-like
  change — restore ciliated cells, increase secretory IgA (a marker of local mucosal immunity),
  and normalize the inflammatory cell profile in bronchoalveolar lavage fluid. A separate
  organotypic tissue-culture study reported that Bronchogen stimulated reparative activity in lung
  explants from both young and aged rats at picomolar-range concentrations. Vendor materials
  commonly cite the sequence Ala-Glu-Asp-Leu (AEDL), though this exact sequence was not
  independently confirmed in the primary literature reviewed. The precise molecular target and
  mechanism are not well-characterized outside this research program, and no human clinical trial
  data was found.

