what_to_expect: >
  There is no established human effect profile. Even the animal literature this compound is best
  known for is actively disputed within the field — the original 2014 papers reporting GDF11 as a
  "rejuvenation factor" for muscle, heart, and brain have been directly contradicted by later
  independent studies reporting no benefit, or harm, from GDF11 administration in comparable
  models. Anyone encountering vendor or forum claims that GDF11 is a straightforward
  muscle-building or anti-aging agent should treat those claims skeptically.

side_effects_common:
  - "Not established in humans"

safety_notes: >
  GDF11 is one of the more scientifically contested compounds in longevity research. The
  foundational 2014 work (Sinha et al., Science) reported that restoring youthful GDF11 levels
  reversed age-related muscle stem cell dysfunction in mice. A subsequent, differently-designed
  study (Egerman et al., Cell Metabolism, 2015) reported the opposite: that GDF11 levels rise,
  not fall, with age, and that GDF11 administration inhibited rather than promoted skeletal
  muscle regeneration in comparable mouse models. Other groups have similarly failed to
  reproduce the original cardiac-hypertrophy reversal claim. Cross-reactivity between GDF11 and
  its close relative myostatin (GDF-8) in older antibody-based assays is a recognized confounder
  in this literature. No human clinical trials of GDF11 administration exist, and given the
  unresolved preclinical controversy, extrapolating any therapeutic benefit to humans would be
  premature. This is a research compound only, not an approved treatment for any condition.
  Consult a healthcare provider.

