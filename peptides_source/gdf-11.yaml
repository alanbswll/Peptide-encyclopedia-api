id: gdf-11
name: GDF-11
status: draft

category_ids:
  - longevity

overview: >
  Growth Differentiation Factor 11 (GDF11) is a circulating member of the TGF-beta superfamily,
  roughly 90% identical in amino acid sequence to myostatin (GDF-8). It became a high-profile
  longevity research target after 2014 parabiosis studies reported that restoring "youthful"
  GDF11 levels in old mice reversed age-related muscle, heart, and brain decline. That claim has
  since become one of the most contested findings in aging biology, with multiple independent
  labs failing to replicate the benefit and some reporting the opposite effect.

key_benefits:
  - Early-stage longevity/rejuvenation research interest following high-profile 2014 parabiosis studies
  - Explored in animal models for cardiac, neurogenic, and skin effects
  - "Note: the foundational muscle-regeneration and cardiac-hypertrophy claims have been directly disputed by independent replication studies (see safety_notes) — this is an unusually contested compound even by early-stage research-peptide standards"

aliases:
  - "GDF11"
  - "Growth Differentiation Factor 11"
  - "BMP-11"

mechanism_of_action: >
  GDF11 signals by binding activin type I/II receptors (predominantly ALK4/ALK5 with ActRIIB) and
  activating SMAD2/3 signaling, the same core pathway used by its close relative myostatin
  (GDF-8). In 2014, parabiosis experiments (surgically joining the circulation of young and old
  mice) and injection of recombinant GDF11 into old mice were reported to reverse age-related
  cardiac hypertrophy, restore muscle stem cell (satellite cell) function, and improve neurogenesis
  and vascular density in the brain, framing declining GDF11 as a driver of age-related decline.
  This was quickly challenged: follow-up work from other groups reported that circulating GDF11
  actually increases, not decreases, with age in some cohorts, that recombinant GDF11 administration
  inhibits rather than promotes skeletal muscle regeneration, and that GDF11 did not reverse
  age-related cardiac hypertrophy in independent hands. Because GDF11 and myostatin are so similar
  in sequence, many older immunoassays could not reliably distinguish the two proteins, which is
  now understood to have contributed to some of the conflicting age-trend data. The field has not
  reached consensus on whether GDF11 is net beneficial, net harmful, or dose/context-dependent in
  aging tissue.

