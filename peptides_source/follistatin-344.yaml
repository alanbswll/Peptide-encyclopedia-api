id: follistatin-344
name: Follistatin 344
status: published

category_ids:
  - growth-hormone

overview: >
  A 344-amino-acid recombinant form of follistatin, a naturally-occurring glycoprotein that
  neutralizes myostatin (GDF-8) and activin, the primary hormonal brakes on skeletal muscle
  growth. The clinical evidence base for this specific isoform comes almost entirely from a
  small gene-therapy trial (AAV1.CMV.FS344) in Becker muscular dystrophy, not from studies of
  the injectable recombinant protein sold by research-chemical vendors — no injectable
  follistatin product is legally marketed for human use.

key_benefits:
  - Explored as a potent myostatin/activin antagonist to remove a brake on muscle growth
  - Gene-therapy delivery of this exact isoform (FS344) improved six-minute walk distance in a small Becker muscular dystrophy trial
  - Reduced endomysial fibrosis and increased muscle fiber size in treated trial tissue

mechanism_of_action: >
  Follistatin binds and neutralizes members of the TGF-beta superfamily, chiefly myostatin
  and activin A, preventing them from engaging the activin type IIB receptor (ActRIIB) and
  triggering the Smad2/3 signaling cascade that normally restrains muscle growth. FS-344 is
  the 344-amino-acid precursor form; after administration it is processed into shorter FS-315
  (circulating, systemic myostatin-binding) and FS-288 (tissue-bound, activin-binding,
  concentrated in reproductive tissue) forms. Because activin also regulates reproductive and
  other tissue, non-selective follistatin activity (blocking activin as well as myostatin) is
  the reason some newer myostatin-inhibitor research has moved toward more selective molecules.

