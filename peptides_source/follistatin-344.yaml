  - "Any vial marketed as 'Follistatin 344' is a research-chemical product without independent clinical validation of that exact formulation"

what_to_expect: >
  There is no established effect profile for injectable recombinant FS-344 protein in healthy
  humans. The only meaningful clinical data on this exact isoform comes from a small (6-patient)
  gene-therapy trial in Becker muscular dystrophy patients, which reported improved six-minute
  walk distance and favorable muscle histology (reduced fibrosis, larger fiber size) at higher
  doses — a one-time localized gene-therapy delivery, not a repeatable injection protocol.

side_effects_common:
  - "Not established for the injectable protein form; the gene-therapy trial reported no adverse effects at the doses studied"

safety_notes: >
  Meaningful human data on FS-344 is limited to a small gene-therapy trial using direct
  intramuscular AAV1.CMV.FS344 delivery in Becker muscular dystrophy patients — a fundamentally
  different route and mechanism than the reconstituted-protein injections marketed by research
  peptide vendors, for which no human safety or efficacy data exists. Because follistatin also
  neutralizes activin (not just myostatin), and activin regulates reproductive and other tissue,
  there is a theoretical concern about off-target hormonal effects with non-selective, repeated,
  high-dose use. No injectable follistatin product is FDA-approved or legally marketed for human
  use. This is a research compound, not an approved treatment for any condition. Consult a
  healthcare provider.

