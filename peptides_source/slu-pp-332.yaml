id: slu-pp-332
name: SLU-PP-332
status: draft

category_ids:
  - fat-loss

overview: >
  SLU-PP-332 is a synthetic small-molecule "exercise mimetic" developed at Saint Louis
  University's Burris laboratory — not a peptide, despite the naming convention. It is a
  pan-agonist of the estrogen-related receptors (ERRalpha, ERRbeta, ERRgamma), a family of
  orphan nuclear receptors that control mitochondrial biogenesis and the metabolic gene program
  normally switched on by aerobic exercise. It is an early-stage research tool compound, not a
  clinically developed drug.

key_benefits:
  - Explored as a compound that reproduces parts of the exercise transcriptional program without physical activity
  - Increased type IIa oxidative muscle fiber content and treadmill exercise capacity in mouse studies
  - Increased energy expenditure and fatty acid oxidation with reduced fat mass accumulation in mouse studies

aliases:
  - "SLU PP 332"
  - "SLU-PP332"
  - "TBI3948"
  - "Pan-ERR agonist"

mechanism_of_action: >
  SLU-PP-332 binds and activates all three estrogen-related receptor subtypes (ERRalpha, ERRbeta,
  ERRgamma), with somewhat higher potency at ERRalpha. These nuclear receptors act as master
  regulators of mitochondrial biogenesis, oxidative phosphorylation, and fatty acid oxidation
  gene programs — the same transcriptional circuitry that PGC-1alpha activates in response to
  aerobic exercise. In mice, SLU-PP-332 administration induced an acute transcriptional signature
  resembling an aerobic exercise bout, increased mitochondrial gene expression and oxygen
  consumption, shifted skeletal muscle fiber composition toward oxidative type IIa fibers, and
  enhanced treadmill running capacity. It also increased whole-body energy expenditure and fatty
  acid oxidation while reducing fat mass accumulation on a high-fat diet, without requiring the
  animals to actually exercise more. The compound's effects are described as ERRalpha-dependent
  based on studies in ERRalpha-knockout animals.

