research_indications:
  - Exercise-mimetic / sedentary metabolic research (mouse models)
  - Skeletal muscle fiber-type switching and mitochondrial biogenesis (preclinical)
  - Diet-induced obesity and fat oxidation (mouse models)
  - Heart failure / cardiac fatty-acid metabolism (early preclinical pan-ERR agonist research)

reconstitution_steps:
  - "Not established for human research use; published animal studies used solutions prepared for injection or oral gavage per standard rodent pharmacology practice"

quality_indicators:
  - "Sold by life-science chemical suppliers (e.g., MedKoo, Tribioscience) explicitly as a research chemical (CAS 303760-60-3), not as a human-use product"
  - "No human clinical trial or regulatory filing currently exists for this compound"

what_to_expect: >
  There is no established human effect profile — SLU-PP-332 has not been studied in people. All
  published efficacy data (exercise capacity, fiber-type switching, fat oxidation) comes from
  mouse studies using research-grade compound and controlled dosing; any anecdotal human use is
  unsupervised, off-label experimentation with a compound whose human pharmacokinetics, dosing,
  and safety profile are undefined.

side_effects_common:
  - "Not established in humans"

safety_notes: >
  SLU-PP-332 is an early-stage academic research tool compound, not a drug candidate that has
  entered human clinical trials. All available efficacy and safety data comes from mouse studies;
  no human pharmacokinetic, dosing, or safety data exists. As a pan-agonist of nuclear hormone
  receptors that also play roles outside skeletal muscle (including cardiac and potentially
  reproductive/endocrine tissue via ERR signaling), broad systemic activation carries
  theoretical off-target risk that has not been characterized in long-term or human studies.
  This is a research chemical only, not an approved treatment for any condition, and is not
  legally marketed for human consumption. Consult a healthcare provider.

