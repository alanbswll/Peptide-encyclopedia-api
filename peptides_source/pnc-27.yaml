what_to_expect: >
  There is no legitimate answer to "what to expect" for PNC-27 in humans: it has not completed
  any published human clinical trial, and there is no controlled human dosing, efficacy, or
  tolerability data. All available evidence is from cultured cancer cell lines, patient-derived
  tumor samples studied outside the body (ex vivo), and animal xenograft-type work. Treat this
  compound as a laboratory research tool, not something with a known human experience.

side_effects_common:
  - "Not established in any controlled human study"

safety_notes: >
  PNC-27 is an early-stage, preclinical experimental cancer research peptide with essentially no
  controlled human safety data. It is not FDA-approved, is not registered in any completed human
  clinical trial, and has no established human dosing or tolerability profile. A published case
  report describes a patient who received experimental PNC-27 therapy outside a formal, regulated
  clinical trial and subsequently developed a massive, ultimately fatal gastrointestinal
  hemorrhage; the case report's authors could not determine whether PNC-27 caused the bleed or
  whether it was coincidental, but it illustrates that this compound has been administered to at
  least one human outside any monitored trial framework, with a serious adverse outcome. This is
  not a general-use supplement or wellness compound — it is a laboratory research tool being
  investigated for a serious disease, self-administration of an untested cancer-targeting agent
  carries unknown and potentially serious risks, and it should not be used outside a properly
  regulated clinical research setting. Consult an oncologist and do not substitute this for
  evidence-based cancer treatment.

