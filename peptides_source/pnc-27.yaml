# Category note: PNC-27 is an experimental anticancer peptide -- this schema has no
# "oncology"/cancer category. Filed under `longevity` (the closest existing bucket used for
# cellular-health / experimental biology compounds in this repo) as the nearest available fit;
# flagged for review, since it is not a longevity compound in the usual sense.
id: pnc-27
name: PNC-27
status: draft

category_ids:
  - longevity

overview: >
  An experimental, laboratory-stage anticancer peptide that fuses a fragment of the p53 tumor-
  suppressor protein's HDM-2-binding domain (residues 12-26) to a cell-penetrating peptide
  derived from the Drosophila antennapedia homeodomain. It was developed by researchers led by
  Matthew Pincus and colleagues (including work published from SUNY Downstate and Johns Hopkins)
  to selectively kill cancer cells that overexpress HDM-2 (the human analog of MDM2) in their
  plasma membranes. PNC-27 has not been tested in any completed, peer-reviewed human clinical
  trial and has essentially no human safety data — it is a preclinical/laboratory research
  compound, not a general-use supplement.

key_benefits:
  - Studied preclinically for selective cancer-cell cytotoxicity via membrane-bound HDM-2 binding
  - Reported in cell-culture and ex vivo tumor studies to spare normal, non-transformed cells and hematopoiesis
  - Proposed dual mechanism: plasma-membrane pore formation (necrosis) plus mitochondrial membrane disruption

mechanism_of_action: >
  PNC-27 contains the p53 peptide sequence that normally binds HDM-2 (the cellular protein that
  targets p53 for degradation), fused to a transmembrane-penetrating peptide. Structural studies
  show PNC-27 adopts an HDM-2-binding conformation matching the native p53-HDM-2 interface. Many
  cancer cell types — but not normal, untransformed cells — express HDM-2 in their plasma
  membrane rather than only intracellularly. PNC-27 binds this membrane-bound HDM-2 and inserts
  into the cancer cell membrane, forming pores that cause cell lysis and necrosis; more recent
  work also reports that PNC-27 enters cancer cells and binds mitochondrial membranes, disrupting
  them as a second cytotoxic mechanism. Because this mechanism depends on HDM-2 being present in
  the plasma membrane — a feature reported in various cancer cell lines and patient-derived tumor
  samples but not in normal cell membranes — researchers have proposed cancer-selective killing
  without direct testing in a controlled human trial.

