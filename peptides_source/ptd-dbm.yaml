research_indications:
  - Hair regrowth and wound-induced hair follicle neogenesis (mouse models)
  - CXXC5/Dishevelled and Wnt/beta-catenin pathway research more broadly
  - Proposed as a candidate mechanism relevant to androgenetic alopecia, based on CXXC5 upregulation found in human balding-scalp tissue (correlational, not interventional, human data)

reconstitution_steps:
  - "Not established for human use; research use to date has been topical/local application in animal models, not systemic reconstitution and injection"

quality_indicators:
  - "No established human-product quality standard exists; this is a laboratory research peptide, not a formulated consumer product"
  - "Third-party COA confirming peptide identity and purity is the only meaningful quality check available for research-vendor material"

what_to_expect: >
  There is no human effect data at all for PTD-DBM. Everything published to date is mouse-model
  and human-tissue (ex vivo dermal papilla cell) work from a single research group; no completed,
  peer-reviewed human trial has evaluated it, and there is no established human dosing, timeline,
  or safety profile to describe.

side_effects_common:
  - "Not established — no published human dosing or side-effect data exists"

safety_notes: >
  PTD-DBM is an early-stage, preclinical research peptide. All published efficacy data comes from
  mouse models and in vitro/ex vivo human cell studies from one research group (the Choi lab at
  Yonsei University); no human clinical trial of PTD-DBM has been completed or published, and no
  IND or equivalent regulatory filing for human testing is documented. It is not FDA-approved, not
  clinically tested in humans, and has no established human safety profile. Any product marketed
  as "PTD-DBM" for topical or injectable human use is being sold well ahead of the underlying
  science. This is a laboratory research compound, not a consumer product. Consult a healthcare
  provider before considering any unapproved compound.

references:
