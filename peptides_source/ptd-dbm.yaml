# Category note: PTD-DBM doesn't fit any existing category well -- it's a hair-follicle/
# Wnt-signaling research peptide, and this schema has no "hair" category. Filed under `skin`
# (dermatology-adjacent) as the closest available fit; flagged for review.
id: ptd-dbm
name: PTD-DBM
status: draft

category_ids:
  - skin

overview: >
  A synthetic research peptide that fuses a protein transduction domain (PTD, derived from HIV-1
  TAT) to a short Dishevelled-binding motif (DBM), designed to disrupt the interaction between
  CXXC5 and Dishevelled (Dvl) and reactivate Wnt/beta-catenin signaling. It was developed by Kang-
  Yell Choi's laboratory at Yonsei University in South Korea, building on their 2015 discovery
  that CXXC5 acts as a negative-feedback regulator of Wnt/beta-catenin signaling. PTD-DBM is an
  early-stage, preclinical (animal-model) research compound studied mainly for hair regrowth and
  wound-induced hair follicle regeneration — it is not an FDA-approved or clinically tested human
  therapy.

key_benefits:
  - Studied preclinically for stimulating hair regrowth and wound-induced hair follicle neogenesis
  - Mechanistically distinct from minoxidil/finasteride — targets the CXXC5-Dishevelled brake on Wnt/beta-catenin signaling rather than androgen or vasodilation pathways
  - CXXC5 was shown to be upregulated in miniaturized follicles from human balding scalp, providing a rationale (though not yet human trial evidence) for this target

mechanism_of_action: >
  CXXC5 is a negative-feedback regulator of the Wnt/beta-catenin pathway that binds directly to
  Dishevelled (Dvl), a key scaffolding protein in canonical Wnt signaling, suppressing downstream
  Wnt activity needed for hair follicle cycling and regeneration. PTD-DBM is a fusion peptide — a
  TAT-derived protein transduction domain (to cross the cell membrane) attached to a short peptide
  motif that competes with Dvl for binding to CXXC5. By disrupting the CXXC5-Dvl interaction,
  PTD-DBM disinhibits Wnt/beta-catenin signaling. In mouse studies, this accelerated hair
  regrowth and wound-induced hair follicle neogenesis, and CXXC5-knockout mice showed accelerated
  hair regrowth consistent with this mechanism.

