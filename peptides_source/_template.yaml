# Template for a new peptide. Copy this file, rename to the peptide's slug
# (e.g. ipamorelin.yaml), fill in, then run:
#   python scripts/add_peptide.py peptides_source/ipamorelin.yaml
#
# category_ids and injection_site_ids must match existing lookup table IDs —
# check GET /categories and GET /injection-sites for the current list, or add
# a new one first with add_lookup.py (see README).

id: example-peptide          # slug, lowercase, hyphenated — becomes the URL/id
name: Example Peptide
status: draft                 # always start as draft; publish separately once reviewed

category_ids:
  - healing                   # must exist in /categories

overview: >
  One or two sentences describing what this peptide is and where it comes from.

key_benefits:
  - Benefit one
  - Benefit two

aliases:
  - "Vendor label variant one"   # e.g. spacing/hyphenation differences vendors print on vial labels
  - "Vendor label variant two"   # used by the vial scanner's fuzzy match against OCR text -- leave empty [] if none known

mechanism_of_action: >
  How it's believed to work, in plain language.

quick_start_guide:
  typical_dose: "250 mcg"
  frequency: "1x daily"
  injection_site_ids:
    - abdomen-subq             # must exist in /injection-sites
  best_timing: "Morning, empty stomach"
  effects_timeline: "1-2 weeks for initial effects"
  storage: "Refrigerate after reconstitution"
  cycle_length: "4-6 weeks"
  break_between: "2-4 weeks"

pharmacokinetics:
  peak: "~1 hour"
  half_life: "~4 hours"
  cleared: "~24 hours"

research_indications:
  - Indication one
  - Indication two

reconstitution_steps:
  - "Step one"
  - "Step two"

quality_indicators:
  - "What a legitimate vial/vendor looks like"

what_to_expect: >
  What a user should realistically expect, timeline-wise.

side_effects_common:
  - "Mild injection site redness"

safety_notes: >
  Known safety caveats, disclaimers, limited human data notes.

references:
  - citation: "Author et al., short description"
    url: "https://example.com/study"

research_protocols:
  - goal: "Primary use case"
    dose: "250 mcg daily"
    timing: "Morning"
    disclaimer: "For research purposes only. Not evaluated by the FDA."
    sort_order: 0

# Interactions are added separately, after both peptides exist, via:
#   POST /peptides/{id}/interactions  (see scripts/add_peptide.py docstring
#   or call it directly with curl — no dedicated script yet since it's rare)
