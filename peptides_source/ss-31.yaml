id: ss-31
name: SS-31
status: published

category_ids:
  - longevity

overview: >
  A synthetic aromatic-cationic tetrapeptide, developed by Hazel Szeto and colleagues and
  commercialized by Stealth BioTherapeutics under the name Elamipretide. SS-31 is one of the
  most clinically advanced mitochondria-targeted peptides: under the brand name Forzinity, it
  received FDA accelerated approval in September 2025 to improve muscle strength in Barth
  syndrome patients — the first approved drug for a primary mitochondrial disease.

key_benefits:
  - Studied for mitochondrial function support
  - FDA-approved (as elamipretide/Forzinity) to improve muscle strength in Barth syndrome
  - Explored in aged-mouse studies for rapid restoration of skeletal muscle mitochondrial energetics

mechanism_of_action: >
  SS-31 concentrates in the inner mitochondrial membrane, where it binds cardiolipin — a
  phospholipid essential to electron transport chain organization and cristae structure — via
  electrostatic and hydrophobic interactions. By stabilizing cardiolipin, it helps preserve
  cristae architecture, improves coupling of oxidative phosphorylation, reduces electron leak
  and reactive oxygen species production, and limits cytochrome c release. In aged mice, a
  single dose rapidly (within an hour) restored resting and maximal mitochondrial ATP
  production and cell energy state toward youthful levels, with no observable effect in young
  muscle — consistent with a mechanism that corrects age- or disease-related mitochondrial
  dysfunction rather than boosting normal function.

