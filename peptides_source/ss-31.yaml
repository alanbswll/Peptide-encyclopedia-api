    - thigh-subq
  best_timing: "No specific timing requirement in trial protocols"
  effects_timeline: "In aged-mouse studies, mitochondrial energetics improved within 1 hour of a single dose; human trials assessed functional outcomes (e.g. 6-minute walk distance) after 12+ weeks of daily dosing"
  storage: "Refrigerate after reconstitution"
  cycle_length: "Clinical trials and the approved Barth syndrome indication use continuous daily dosing rather than defined on/off cycles"
  break_between: "Not established for cyclical research use"

pharmacokinetics:
  peak: "Rapidly absorbed subcutaneously; exact human Tmax not published in searched sources"
  half_life: "Short; requires daily subcutaneous dosing in clinical trials"
  cleared: "Not established in detail in publicly available sources"

research_indications:
  - "Barth syndrome (FDA-approved indication for elamipretide/Forzinity, muscle strength improvement)"
  - Primary mitochondrial myopathy (mixed clinical trial results — see safety notes)
  - Skeletal muscle mitochondrial energetics in aging (animal studies)
  - Cardiac and renal ischemia-reperfusion injury (preclinical)

reconstitution_steps:
  - Reconstitute with bacteriostatic water; refrigerate.

quality_indicators:
  - "White lyophilized powder that fully dissolves into a clear, colorless solution"
  - "Third-party COA available confirming peptide identity and purity"
  - "No visible discoloration, clumping, or particulate after reconstitution"

what_to_expect: >
  SS-31/elamipretide is unusual among longevity peptides in having real Phase 2/3 human trial
  data. In Barth syndrome patients, daily dosing was associated with improved 6-minute walk
  distance and other functional measures over 12+ weeks, supporting its 2025 FDA approval for
  that indication. However, in the larger MMPOWER-3 trial in primary mitochondrial myopathy
  (a broader, more genetically heterogeneous population), elamipretide did not separate from
  placebo on its primary endpoints, though a subgroup with nuclear DNA-related disease showed a
  signal of benefit. This means real-world effects are likely to vary substantially by
  underlying condition rather than being a general-purpose benefit.

side_effects_common:
  - "Injection site reactions (redness, itching, discoloration) — the most commonly reported adverse event in trials"
  - "Mild gastrointestinal symptoms"
  - "Headache"

safety_notes: >
  SS-31 (elamipretide) has one of the strongest human clinical safety records among the peptides
  in this encyclopedia, with multiple completed Phase 2/3 trials and an FDA-approved indication
  (Forzinity, for Barth syndrome muscle strength, in patients ≥30 kg). That said, its efficacy is
  indication-specific: it succeeded in Barth syndrome trials but failed to meet primary endpoints
  in the broader MMPOWER-3 primary mitochondrial myopathy trial. Injection site reactions were
  the most common adverse event across trials. Off-label or non-clinical use has not been
  evaluated for safety or efficacy outside these studied populations. Consult a healthcare
  provider.

