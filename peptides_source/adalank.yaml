safety_notes: >
  This is an unstudied analog: no safety, efficacy, dosing, or pharmacokinetic data specific to
  Adalank/N-Acetyl Selank Amidate has been published in any peer-reviewed source. Its
  pharmacology is assumed, not demonstrated, based on structural similarity to Selank. It is not
  FDA-approved, not evaluated for human use, and long-term safety is entirely unknown. This is
  an experimental research compound, not an approved treatment for any condition. Consult a
  healthcare provider.

