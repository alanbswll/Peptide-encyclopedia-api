id: adalank
name: Adalank (N-Acetyl Selank Amidate)
status: draft

category_ids:
  - cognitive

overview: >
  A dual-modified analog of Selank, bearing an N-terminal acetyl group and a C-terminal amide,
  designed to resist enzymatic degradation (aminopeptidases and carboxypeptidases) longer than
  unmodified Selank. It is marketed under names including "Adalank" and "N-Acetyl Selank
  Amidate." No studies of this specific modified molecule have been published — all available
  pharmacology is extrapolated from research on its parent compound, Selank.

key_benefits:
  - Marketed as a longer-acting, more stable analog of Selank
  - Intended pharmacology (anxiolytic support) is extrapolated entirely from Selank research, not from studies of this molecule itself

mechanism_of_action: >
  Adalank is structurally Selank with an added N-terminal acetyl group and C-terminal amide,
  modifications intended to slow degradation by aminopeptidases and carboxypeptidases and
  thereby extend the molecule's activity relative to unmodified Selank. Selank itself is
  thought to modulate GABAergic tone and serotonin metabolism, and to inhibit enkephalin-
  degrading enzymes, prolonging endogenous opioid peptide activity — see the Selank entry in
  this encyclopedia for that underlying research. No published study has directly tested
  whether Adalank retains the same mechanism, potency, or receptor engagement as Selank; this
  is a structural rationale, not a demonstrated equivalence.

