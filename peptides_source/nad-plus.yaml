  - citation: "Martens CR, Denman BA, Mazzo MR, et al. Chronic nicotinamide riboside supplementation is well-tolerated and elevates NAD+ in healthy middle-aged and older adults. Nat Commun. 2018;9(1):1286."
    url: "https://pubmed.ncbi.nlm.nih.gov/29599478/"

