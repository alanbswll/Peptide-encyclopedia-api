research_indications:
  - Aging brain / age-related neurological conditions (proposed research use)
  - Memory and task-learning support in rodent models, including a stroke model

reconstitution_steps:
  - "Not applicable — studied as an orally administered compound, not reconstituted or injected"

quality_indicators:
  - "Not an FDA-approved product; marketed mainly as a novel dietary-ingredient supplement (cGP-PRo) by one commercial source rather than as a research-chemical vial"
  - "No established injectable/reconstitution product exists for this compound"

what_to_expect: >
  There is no established human effect profile. Available evidence is rodent behavioral studies
  (memory tasks, stroke-model task learning) and mechanistic work on IGF-1/IGFBP-3 regulation,
  concentrated in publications from one New Zealand research group. No human clinical trial data
  was found.

safety_notes: >
  Cyclic glycine-proline's evidence base is almost entirely preclinical (rodent) and mechanistic,
  from a small number of research groups, with essentially no independent human safety or
  efficacy data. This is an experimental research compound with unverified relevance to humans at
  any particular dose, not an approved treatment for any condition. Consult a healthcare
  provider.

