id: cyclic-glycine-proline
name: Cyclic Glycine-Proline (cGP)
status: draft

category_ids:
  - cognitive

overview: >
  A small, naturally-occurring cyclic dipeptide (a cyclized form of Gly-Pro) that is an
  endogenous breakdown metabolite of IGF-1, found in brain tissue and identified as a
  bioactive regulator of IGF-1 signaling. It is small and lipophilic enough to be orally
  bioavailable and cross the blood-brain barrier, which distinguishes it from most injectable
  peptides in this encyclopedia. Research interest centers on the aging brain and
  age-related neurological conditions, and is concentrated in one New Zealand-based research
  group (University of Auckland).

key_benefits:
  - Naturally-occurring, orally bioavailable, blood-brain-barrier-crossing dipeptide
  - Proposed to normalize IGF-1 bioavailability in the brain via competition for IGFBP-3 binding
  - Studied in rodent models for memory/task-learning support, including after stroke

mechanism_of_action: >
  cGP is generated in the body as a proteolytic breakdown product of IGF-1 and retains
  affinity for IGF binding protein-3 (IGFBP-3). By competing with intact IGF-1 for IGFBP-3
  binding, cGP is proposed to modulate how much free IGF-1 is available for signaling in
  brain tissue — a regulatory role distinct from directly activating a receptor itself. In
  rodent studies, oral cGP administration increased brain cGP concentration, improved memory
  in models of scopolamine- or electroshock-induced deficits, and supported task learning in
  a stroke model.

