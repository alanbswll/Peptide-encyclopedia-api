id: ghk-cu
name: GHK-Cu
status: published

category_ids:
  - skin

overview: >
  A naturally occurring copper-binding tripeptide (Gly-His-Lys) found in human plasma, saliva, and
  urine that declines with age. First identified by Dr. Loren Pickart in the 1970s, it is widely
  used in cosmetic dermatology as a topical "copper peptide" for skin and hair research.

key_benefits:
  - Popular in skin and hair research
  - Studied for stimulating collagen, elastin, and glycosaminoglycan synthesis in skin
  - Explored for supporting wound healing and post-procedure skin recovery

mechanism_of_action: >
  GHK-Cu acts primarily as a copper-delivery peptide: it chelates Cu2+ and supplies it as a
  cofactor to copper-dependent enzymes, including lysyl oxidase (which cross-links collagen and
  elastin fibers) and superoxide dismutase (an antioxidant enzyme). Separately from its copper
  transport role, gene-expression studies show the GHK peptide itself modulates the activity of a
  large number of genes involved in tissue remodeling, anti-inflammatory signaling, and antioxidant
  defense, which is thought to underlie its reported effects on fibroblast activity, dermal matrix
  synthesis, and wound repair.

quick_start_guide:
  typical_dose: "Topical serums/creams: ~0.1–2% GHK-Cu concentration"
  frequency: "1–2x daily"
  best_timing: "Applied to clean, dry skin, morning and/or evening"
  effects_timeline: "Early hydration/texture changes reported within a few weeks; firmness and fine-line changes are typically assessed after 8–12 weeks of consistent use"
  storage: "Store cold and shielded from light — the copper-peptide complex is light- and oxidation-sensitive"
  cycle_length: "Typically used continuously as part of a skincare routine; not commonly cycled"
  break_between: "Not established for topical use"

pharmacokinetics:
  peak: "Not well characterized for topical use; effects are local to the skin rather than systemic"
  half_life: "Free GHK tripeptide is rapidly broken down by plasma peptidases when unbound in circulation, which is part of why it is formulated for topical (local) rather than systemic delivery"
  cleared: "Not meaningfully systemic at typical cosmetic topical concentrations"

research_indications:
  - Skin firmness, elasticity, and photoaging (topical research)
  - Wound healing and tissue repair support
  - Hair follicle / scalp research
  - Post-procedure skin recovery (e.g. after laser resurfacing or microneedling)

reconstitution_steps:
  - "Sensitive to light; store cold and shielded."

quality_indicators:
  - "Ingredient label lists a specific GHK-Cu / 'copper tripeptide-1' concentration rather than an unspecified amount"
  - "Packaged in opaque, airless, or dark-glass containers to limit light and air exposure"
  - "Characteristic pale blue color from the copper-peptide complex; browning, precipitation, or color loss suggests degradation"

what_to_expect: >
  Most users notice no acute sensation beyond normal application feel; a faint, temporary blue
  tinge from the copper-peptide complex is common immediately after application. Reported
  improvements in skin texture, hydration, and firmness build gradually over weeks of consistent
  use rather than appearing immediately.

side_effects_common:
  - "Mild redness or irritation at the application site"
  - "Rare allergic contact dermatitis"
  - "Temporary blue tinge on skin immediately after application"

safety_notes: >
  Copper is an essential trace mineral, and topical GHK-Cu at typical cosmetic concentrations has
  not been associated with systemic copper toxicity in the published literature. That said, much of
  the foundational gene-expression and mechanistic research was generated or co-authored by the
  peptide's original discoverer and patent holder, so independent replication is thinner than the
  overall volume of literature might suggest. GHK-Cu is sold and regulated as a cosmetic ingredient,
  not an FDA-evaluated drug. Copper peptides can potentially destabilize or reduce the effectiveness
  of other actives (notably vitamin C and some direct-acid exfoliants) if layered together; consult
  a dermatologist about routine sequencing.

references:
