id: vilon
name: Vilon
status: published

category_ids:
  - longevity

overview: >
  A synthetic dipeptide (Lys-Glu) developed by Vladimir Khavinson's group at the St. Petersburg
  Institute of Bioregulation and Gerontology as a simplified, shorter analog related to the
  thymus-derived bioregulator family that includes Thymalin. Vilon's supporting research comes
  almost entirely from Khavinson-affiliated rodent studies.

key_benefits:
  - Studied alongside Thymalin for longevity support
  - Explored in mouse studies for lifespan extension and reduced spontaneous tumor development
  - Investigated for effects on physical activity, endurance, and biological age markers in aging mice

mechanism_of_action: >
  Vilon is proposed to act as a short-peptide "bioregulator" affecting gene expression during
  aging, similar in concept to other Khavinson-group dipeptides. In mouse studies, subcutaneous
  Vilon injections increased physical activity and endurance, lowered body temperature, and
  reduced the development of spontaneous tumors, alongside an extension of lifespan; gene
  expression studies in mouse heart tissue (DNA microarray) reported changes in expression
  patterns with Vilon treatment. The precise molecular target and mechanism are not
  well-characterized outside of this research program.

