id: bioglutide
name: Bioglutide (NA-931)
status: published

category_ids:
  - fat-loss

overview: >
  An investigational, orally-dosed small molecule developed by Biomed Industries under the code
  NA-931 (marketed in research-chemical circles as "Bioglutide"). Unlike most entries in this
  encyclopedia, it is not a peptide — it is a small molecule engineered to activate four
  metabolic receptors at once. As of this writing it has completed Phase 1 and Phase 2 trials,
  with Phase 3 development beginning; results so far are from company-sponsored conference
  presentations (ADA, ENDO, EASD) rather than a peer-reviewed journal publication.

key_benefits:
  - Investigational oral quadruple-receptor agonist for obesity/overweight
  - Phase 2 data presented at ADA 2025 reported dose-dependent weight loss without muscle loss
  - Being advanced into Phase 3 trials as monotherapy and combined with semaglutide/tirzepatide

mechanism_of_action: >
  NA-931 is described as a first-in-class oral small molecule that simultaneously agonizes the
  IGF-1, GLP-1, GIP, and glucagon receptors — three incretin-axis targets shared with other
  metabolic agents (similar in concept to tirzepatide and retatrutide) plus IGF-1 receptor
  activity, which the developer has presented as the basis for weight loss without the lean-mass
  loss often seen with incretin-only agents. The full mechanistic detail behind the IGF-1R
  component's role in preserving muscle has not yet appeared in an independently peer-reviewed
  paper.

quick_start_guide:
  typical_dose: "Not established outside company trials; the Phase 2 study used up to 150 mg once daily (oral)"
  frequency: "1x daily (oral capsule) in trials to date"
  best_timing: "Not established outside company trials"
