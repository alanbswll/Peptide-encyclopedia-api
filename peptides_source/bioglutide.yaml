  cleared: "Not published in independently reviewed literature"

research_indications:
  - Investigational treatment for obesity/overweight (Phase 3 trials starting as of publication)
  - Type 2 diabetes (stated development target alongside obesity)

reconstitution_steps:
  - "Not applicable — dosed as an oral capsule in trials, not reconstituted or injected"

quality_indicators:
  - "Not an FDA-approved commercial product; no legitimate retail/pharmacy supply chain exists"
  - "Not widely available through mainstream research-chemical vendors as of this writing; sourcing is inconsistent and unverified"

what_to_expect: >
  Only company-reported, conference-presented data exists. The Phase 2 study (NCT06564753, 125
  participants, 13 weeks) reported mean weight loss up to 13.8% from baseline at the 150 mg daily
  dose (11.9% relative to placebo), with up to 72% of treated participants achieving at least 12%
  weight loss versus 1.9% on placebo, and no observed muscle loss. These results have not yet
  been published in a peer-reviewed journal or independently replicated.

side_effects_common:
  - "Gastrointestinal adverse events (reported as mostly mild in company-presented data)"

safety_notes: >
  Bioglutide/NA-931 is an early-stage investigational compound. All efficacy and safety data
  currently available comes from the developer's own conference presentations (American Diabetes
  Association, Endocrine Society meetings) rather than a peer-reviewed journal article, and has
  not been independently replicated. It is not FDA-approved, not available through a legitimate
  pharmacy supply chain, and long-term human safety data does not yet exist. This is a research
  compound only, not an approved treatment for any condition. Consult a healthcare provider.

