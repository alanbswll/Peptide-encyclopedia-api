id: pancragen
name: Pancragen
status: draft

category_ids:
  - gut-health                 # no dedicated pancreas/metabolic category exists; "gut-health" is
                                # the closest available fit for a digestive-organ bioregulator.

overview: >
  A synthetic tetrapeptide (Lys-Glu-Asp-Trp) from the Khavinson-school family of short
  "bioregulator" peptides, developed at the St. Petersburg Institute of Bioregulation and
  Gerontology as a tissue-specific preparation targeting the pancreas, part of the same research
  program that produced Thymalin, Vilon, Cardiogen, and Livagen. Pancragen is one of the
  better-documented compounds in this batch, with published cell-culture and organotypic
  tissue-culture data, though still entirely from Khavinson-affiliated sources.

key_benefits:
  - Studied for restoring expression of pancreatic differentiation markers in aging pancreatic
    cell culture
  - Explored in organotypic tissue culture for stimulating reparative activity in pancreas
    explants from aged rats

aliases:
  - "Pankragen"                # direct transliteration of the Cyrillic "Панкраген" seen on some vendor labels

mechanism_of_action: >
  Pancragen is proposed to act as a short-peptide "bioregulator" affecting gene expression in
  pancreatic tissue, similar in concept to other Khavinson-group tetrapeptides. In a 2013 study,
  Pancragen was reported to enhance expression of differentiation markers in both acinar and
  islet-of-Langerhans pancreatic cells that had declined with age, in cell culture from young and
  aged animals. A separate organotypic tissue-culture study, which also examined Cardiogen,
  Bronchogen, and Prostamax in their respective matched tissues, reported that Pancragen
  stimulated reparative activity in pancreas explants from young and aged rats at an effective
  concentration of roughly 0.05 ng/mL. Vendor materials describing effects on specific
  transcription factors (Pdx1, Pax6, Ptf1a, Foxa2, Nkx2.2, Pax4), streptozotocin-diabetic rat
  models, primate studies, or a human diabetes trial were not corroborated in the primary
  literature reviewed and should be treated as unverified marketing claims. The precise molecular
  target and mechanism are not well-characterized outside this research program, and no
  independently verifiable human clinical trial data was found.

