research_indications:
  - Pancreatic cell differentiation-marker restoration in aging cell culture
  - Pancreatic tissue reparative activity (organotypic tissue culture, young and aged rats)

reconstitution_steps:
  - Reconstitute with bacteriostatic water; refrigerate.

quality_indicators:
  - "White to off-white lyophilized powder that fully dissolves into a clear solution"
  - "Third-party COA available confirming peptide identity and purity"
  - "No visible discoloration, clumping, or particulate after reconstitution"

what_to_expect: >
  There is no established human effect profile for Pancragen. Available evidence is from cell-
  culture and organotypic tissue-culture studies conducted by researchers affiliated with Vladimir
  Khavinson's institute; no human clinical trials or independent replications by research groups
  outside that program were found, despite vendor claims of diabetes- and pancreatitis-related
  benefits.

safety_notes: >
  Pancragen's evidence base is limited to cell-culture and tissue-culture studies published by
  Vladimir Khavinson's research group and collaborators in lower-circulation Russian and
  Bull Exp Biol Med publications. There is no independent human safety or efficacy data, and
  claims of effects on blood glucose, insulin resistance, or diabetic outcomes in humans were not
  corroborated by any verifiable primary source. This is an experimental research compound with
  unverified relevance to humans, not an approved treatment for diabetes, pancreatitis, or any
  other condition. Consult a healthcare provider.

