  - Reconstitute with bacteriostatic water; refrigerate.

quality_indicators:
  - "White to off-white lyophilized powder that fully dissolves into a clear solution"
  - "Third-party COA available confirming peptide identity and purity"
  - "No visible discoloration, clumping, or particulate after reconstitution"

what_to_expect: >
  The only human data found is a small, open-label (not placebo-controlled or blinded) study of
  48 men aged 54-68 with age-related androgen decline, using an oral capsule formulation for 20
  days. Reported changes included an increase in mean serum testosterone (from roughly 6.1 to 7.3
  ng/mL), an increase in sperm count (roughly 16 to 22 million/mL), and improved sperm motility,
  with no adverse effects reported in that study. This was not a randomized controlled trial, was
  conducted entirely by the Khavinson-affiliated institute, has not been independently replicated,
  and used an oral rather than injectable route — none of which supports any specific expectation
  for an injectable research use of this peptide.

safety_notes: >
  Testagen's only human clinical data is a small, open-label, non-randomized study (48 men) from
  the originating Russian institute, published in a specialty urology reference resource rather
  than an independently reviewed journal indexed in PubMed, and using an oral capsule rather than
  an injectable formulation. Toxicology and DNA-binding data come from the same research program.
  There is no independent replication, no blinded controlled trial, and no injectable-route human
  safety or dosing data of any kind. This is an experimental research compound with unverified
  relevance to injectable human use, not an approved treatment for hypogonadism, infertility, or
  any other condition. Consult a healthcare provider.

