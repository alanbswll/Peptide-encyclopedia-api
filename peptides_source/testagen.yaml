id: testagen
name: Testagen
status: draft

category_ids:
  - sexual-health

overview: >
  A synthetic tetrapeptide (Lys-Glu-Asp-Gly) from the Khavinson-school family of short
  "bioregulator" peptides, developed at the St. Petersburg Institute of Bioregulation and
  Gerontology as a tissue-specific preparation targeting testicular tissue, part of the same
  research program that produced Thymalin, Vilon, Cardiogen, and Livagen. Testagen has one of the
  more substantial evidence bases in this batch — including toxicology screening, a rodent
  radiation-injury fertility model, and a small open-label human clinical study — though it
  remains entirely from Khavinson-affiliated sources and was studied as an oral capsule, not an
  injectable.

key_benefits:
  - Reported tissue-specific action on testicular tissue in toxicology screening, with no
    significant effect on other organs tested (thymus, brain, heart, liver, pancreas, thyroid,
    prostate, bladder, skin, kidneys, blood vessels, ovaries, retina)
  - Studied in irradiated male rats for restoring fertility (pregnancy rate in mated females) after
    radiation-induced testicular injury
  - Investigated in a small open-label study of men aged 54-68 with age-related androgen decline
    for effects on testosterone and semen parameters

aliases: []

mechanism_of_action: >
  Testagen is proposed to act as a short-peptide "bioregulator" affecting gene expression in
  testicular tissue (Leydig and Sertoli cells), similar in concept to other Khavinson-group
  tetrapeptides. A DNA-interaction study found that fluorescently labeled Testagen (Lys-Glu-Asp-
  Gly) penetrates the nucleus of HeLa cells and showed preferential in vitro binding to
  CAG-containing DNA oligonucleotide sequences, consistent with the general Khavinson-group
  hypothesis that these short peptides act by binding regulatory DNA regions rather than through
  receptor-mediated signaling. In acute and chronic toxicity studies, Testagen showed no general
  toxic, allergenic, immunotoxic, embryotoxic, teratogenic, or local-irritant effects even at
  doses 10,000-15,000 times the proposed therapeutic dose. In a rat model of radiation-induced
  testicular injury, Testagen given either preventively or starting 15 days post-irradiation
  increased the pregnancy rate of mated females compared to untreated irradiated controls,
  reported as tissue-specific action on testicular function. The precise molecular target and
  mechanism are not well-characterized outside this research program.

