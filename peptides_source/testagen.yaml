research_indications:
  - Tissue-specific action on testicular (Leydig/Sertoli cell) tissue (toxicology/DNA-binding
    studies)
  - Fertility restoration after radiation-induced testicular injury (rat model)
  - Testosterone and semen-parameter changes in men aged 54-68 with age-related androgen decline
    (small open-label human study, oral capsule)

