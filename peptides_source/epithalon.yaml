id: epithalon
name: Epithalon
status: published

category_ids:
  - longevity

overview: >
  A synthetic tetrapeptide (Ala-Glu-Asp-Gly, "AEDG") modeled on Epithalamin, a bovine pineal
  gland extract. Developed by Vladimir Khavinson's group in Russia, it is the most-studied
  member of the Khavinson "peptide bioregulator" family and is best known for laboratory
  findings on telomerase activation in human cell cultures.

key_benefits:
  - Typically used in short cycles
  - Explored in cell-culture studies for telomerase activation and telomere elongation
  - Studied in animal models for normalizing age-related melatonin and cortisol rhythms

mechanism_of_action: >
  In telomerase-negative human fetal fibroblast cultures, Epithalon induced expression of the
  telomerase catalytic subunit (hTERT) and increased telomerase enzymatic activity (measured by
  TRAP assay), which was associated with telomere elongation and an extended number of population
  doublings beyond the normal Hayflick limit. Separately, in aging animal studies Epithalon (and
  the pineal extract it's modeled on, Epithalamin) has been reported to stimulate pineal
  melatonin synthesis and normalize circadian cortisol secretion. The proposed epigenetic
  mechanism involves the peptide binding chromatin and influencing gene expression during
  differentiation, though the full molecular pathway in humans is not established.

