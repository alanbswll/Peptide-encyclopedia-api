  typical_dose: "5–10 mg/day"
  frequency: "1x daily"
  injection_site_ids:
    - abdomen-subq
  best_timing: "No specific timing requirement reported in the literature"
  effects_timeline: "Cell-culture telomerase effects were measured over weeks of continuous culture; no established human timeline exists"
  storage: "Refrigerate after reconstitution; use within 2–4 weeks"
  cycle_length: "10–20 days"
  break_between: "Several months, per traditional Khavinson-protocol dosing schedules (2–3x per year)"

pharmacokinetics:
  peak: "Not established in humans"
  half_life: "Not established; as a short unprotected tetrapeptide it is expected to be cleared rapidly by plasma peptidases"
  cleared: "Not established"

research_indications:
  - Cellular senescence and telomere biology (in vitro)
  - Circadian rhythm and melatonin regulation (animal models)
  - General longevity/anti-aging research interest

reconstitution_steps:
  - Reconstitute with bacteriostatic water; refrigerate.

quality_indicators:
  - "White lyophilized powder that fully dissolves into a clear, colorless solution"
  - "Third-party COA available confirming peptide identity and purity"
  - "No visible discoloration, clumping, or particulate after reconstitution"

what_to_expect: >
  There is no well-characterized subjective effect profile in humans. Reported effects
  (telomerase activation, melatonin normalization) come almost entirely from cell-culture and
  animal studies; any user-reported effects on sleep or well-being are anecdotal, not
  clinically established.

safety_notes: >
  Nearly all of the foundational research on Epithalon (the synthetic AEDG tetrapeptide) comes
  from Vladimir Khavinson's laboratory in Russia and is largely published in Russian-language or
  low-circulation journals; independent replication outside that group is limited. Note also
  that the larger, longer human studies often cited for this class of compound (e.g. 15-year
  mortality follow-ups) used Epithalamin, the original bovine pineal polypeptide extract — not
  the synthetic 4-amino-acid Epithalon molecule sold today. Long-term human safety data on
  synthetic Epithalon itself is essentially absent. This is a research compound, not an approved
  treatment for any condition. Consult a healthcare provider.

