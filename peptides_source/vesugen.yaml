id: vesugen
name: Vesugen
status: draft

category_ids:
  - longevity                 # no cardiovascular/vascular category exists in the lookup table;
                               # closest available fit, matching the sibling Cardiogen entry (heart).

overview: >
  A synthetic tripeptide (Lys-Glu-Asp) from the Khavinson-school family of short "bioregulator"
  peptides, developed at the St. Petersburg Institute of Bioregulation and Gerontology as a
  tissue-specific preparation targeting the vascular system (blood vessel walls and endothelium),
  part of the same research program that produced Thymalin, Vilon, Cardiogen, and Livagen.
  Vesugen's supporting research comes almost entirely from Khavinson-affiliated studies, including
  one small human clinical study in elderly patients with peripheral arterial disease.

key_benefits:
  - Studied for stimulating expression of the proliferation marker Ki-67 in aging vascular
    endothelial cell cultures
  - Investigated in a small human clinical study of elderly and older patients with chronic lower-
    limb arterial insufficiency

aliases:
  - "Vezugen"                  # alternate transliteration used in the peptide's own PubMed-indexed
                                # English-language abstracts (from the Cyrillic "Везуджен")

mechanism_of_action: >
  Vesugen is proposed to act as a short-peptide "bioregulator" affecting gene expression in
  vascular endothelial and smooth muscle tissue, similar in concept to other Khavinson-group
  tripeptides. In a 2014 in vitro study, Vesugen (alongside a related peptide designated D-7)
  stimulated expression of the proliferation-associated protein Ki-67 in tissue-specific and
  vascular endothelial cell cultures that had declined with age; molecular docking modeling
  suggested the peptide could contact the promoter region of the MKI67 gene, proposed as an
  epigenetic mechanism for the observed effect. In a separate small clinical study of 41 older and
  elderly patients with lower-limb chronic arterial insufficiency (a form of peripheral vascular
  disease often linked to atherosclerosis), peptide bioregulator treatment was reported to
  significantly improve blood-flow parameters. The precise molecular target and mechanism are not
  well-characterized outside this research program.

