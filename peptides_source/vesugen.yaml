research_indications:
  - Vascular endothelial cell proliferation-marker (Ki-67) support in aging cell culture
  - Blood-flow parameters in elderly patients with chronic lower-limb arterial insufficiency
    (small, non-blinded clinical study)

reconstitution_steps:
  - Reconstitute with bacteriostatic water; refrigerate.

quality_indicators:
  - "White to off-white lyophilized powder that fully dissolves into a clear solution"
  - "Third-party COA available confirming peptide identity and purity"
  - "No visible discoloration, clumping, or particulate after reconstitution"

what_to_expect: >
  There is no well-characterized human effect profile for Vesugen outside of one small, apparently
  non-blinded clinical study in elderly patients with peripheral arterial disease, conducted by
  researchers affiliated with Vladimir Khavinson's institute. That study and the supporting
  endothelial cell-culture work have not been independently replicated by research groups outside
  that program.

safety_notes: >
  Vesugen's evidence base is limited to one in vitro endothelial cell-culture study and one small,
  apparently non-blinded human clinical study in elderly patients with arterial disease, both
  published by Vladimir Khavinson's research group and collaborators in a lower-circulation
  Russian gerontology journal. There is no independent, blinded, or placebo-controlled human trial
  data, and no independent replication. This is an experimental research compound with unverified
  relevance to humans, not an approved treatment for peripheral artery disease, atherosclerosis,
  or any other vascular condition. Consult a healthcare provider.

