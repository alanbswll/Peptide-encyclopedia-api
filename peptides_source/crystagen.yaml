id: crystagen
name: Crystagen
status: draft

category_ids:
  - immune

overview: >
  A synthetic tripeptide from the Khavinson-school family of short "bioregulator" peptides,
  developed at the St. Petersburg Institute of Bioregulation and Gerontology as a tissue-specific
  preparation targeting the thymus and immune system, part of the same research program that
  produced Thymalin, Vilon, Cardiogen, and Livagen. Crystagen's supporting research comes almost
  entirely from Khavinson-affiliated studies.

key_benefits:
  - Studied alongside Vilon, Thymogen, and a related peptide (R-1) for immunoprotective effects
    in aging spleen tissue
  - Marketed by the originating institute as an immune-system bioregulator derived from thymus
    tissue analysis

aliases:
  - "Kristagen"                # direct transliteration of the Cyrillic "Кристаген" seen on some vendor labels

mechanism_of_action: >
  Crystagen is proposed to act as a short-peptide "bioregulator" affecting gene expression in
  thymic and immune tissue, similar in concept to other Khavinson-group tripeptides. Russian
  manufacturer materials describe its composition as glutamic acid, aspartic acid, and proline
  (Glu-Asp-Pro), though this was not independently confirmed against a peer-reviewed structural
  source. In a 2014 study of spleen tissue from aging animals, Crystagen was one of four short
  peptides (alongside Vilon, Thymogen, and a peptide designated R-1) examined for molecular
  mechanisms of immunoprotective activity, each reported to affect distinct aspects of
  T-helper-cell and B-cell activation, proliferation, or apoptosis during splenic aging. The
  precise molecular target and mechanism specific to Crystagen are not well-characterized outside
  this research program, and no human clinical trial data was found.

