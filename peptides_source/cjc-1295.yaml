  - goal: "GH/IGF-1 Axis Support (no-DAC form)"
    dose: "100 mcg 1–2x daily"
    timing: "Pre-workout and/or before bed, empty stomach"
    disclaimer: "For research purposes only. Not evaluated by the FDA."
    sort_order: 0
