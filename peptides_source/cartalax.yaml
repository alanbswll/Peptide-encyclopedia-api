id: cartalax
name: Cartalax
status: draft

category_ids:
  - bone                      # no dedicated cartilage/joint category exists; "bone" is the closest
                               # available fit for a connective-tissue/musculoskeletal bioregulator.

overview: >
  A synthetic tripeptide from the Khavinson-school family of short "bioregulator" peptides,
  developed at the St. Petersburg Institute of Bioregulation and Gerontology and marketed as a
  cartilage/joint-tissue bioregulator, part of the same research program that produced Thymalin,
  Vilon, Cardiogen, and Livagen. Cartalax's supporting research comes almost entirely from
  Khavinson-affiliated studies, and — notably — none of the PubMed-indexed studies of this exact
  sequence measured a cartilage-specific endpoint (see safety_notes).

key_benefits:
  - Marketed by the originating institute as a cartilage-tissue and musculoskeletal bioregulator
  - The Ala-Glu-Asp sequence has been studied (under laboratory code names, not the trade name
    "Cartalax") for effects on cell proliferation and apoptosis markers in other tissue types

aliases:
  - "Kartalaks"                # direct transliteration of the Cyrillic "Карталакс" seen on some vendor labels

mechanism_of_action: >
  Cartalax is proposed to act as a short-peptide "bioregulator" affecting gene expression in
  cartilage and connective tissue, similar in concept to other Khavinson-group tripeptides.
  Vendor and manufacturer materials describe it as the tripeptide Ala-Glu-Asp (AED), and Russian
  commercial listings describe clinical use in osteochondrosis, osteoarthritis, and osteoporosis
  prevention, developed and patented by the St. Petersburg Institute of Bioregulation and
  Gerontology. However, the AED sequence's PubMed-indexed research (published under laboratory
  codes such as "T-31" rather than the trade name Cartalax) has tested it in kidney explant
  cultures, skin fibroblasts, thymocytes, mesenchymal stem cells, and neuronal differentiation
  models — not in chondrocyte or cartilage-specific assays. In those other-tissue studies, AED
  increased markers of cell proliferation (e.g., Ki-67) and reduced apoptosis/senescence markers
  (e.g., p53, p16, p21) to a lesser degree than tissue-matched polypeptide complexes tested
  alongside it. Whether these effects generalize to cartilage or joint tissue specifically has not
  been independently demonstrated in the literature reviewed.

