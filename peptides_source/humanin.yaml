id: humanin
name: Humanin
status: published

category_ids:
  - longevity

overview: >
  A 24-amino-acid peptide encoded within mitochondrial DNA (in the 16S rRNA region), first
  identified in 2001 by Hashimoto and colleagues in a screen for factors protecting neurons
  against Alzheimer's-related toxicity. Humanin was the first mitochondrial-derived peptide
  (MDP) discovered and is studied by groups including Pinchas Cohen's lab at USC for its
  cytoprotective and longevity-related signaling roles.

key_benefits:
  - Early-stage longevity research interest
  - Explored in cell-culture and animal models for cytoprotective, anti-apoptotic effects
  - Endogenous levels associated with exceptional longevity in centenarian-offspring studies

mechanism_of_action: >
  Humanin acts as a cytoprotective signaling peptide, inhibiting apoptosis in part by blocking
  the mitochondrial membrane association and oligomerization of pro-apoptotic proteins Bax and
  Bid, which helps preserve mitochondrial membrane integrity under cellular stress. In the
  original discovery work, Humanin and its analogs suppressed neuronal death induced by
  familial Alzheimer's disease mutations (APP, PS1, PS2) and amyloid-beta. In C. elegans,
  overexpressing the humanin gene extends lifespan in a daf-16/FOXO-dependent manner, and in
  mice, twice-weekly dosing with the potent analog HNG improved metabolic healthspan markers and
  reduced inflammatory markers. Endogenous humanin levels decline with age across several
  species, and offspring of centenarians have been reported to carry higher circulating humanin
  levels than age-matched controls.

