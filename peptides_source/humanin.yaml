  best_timing: "No specific timing requirement established in the literature"
  effects_timeline: "Not established in humans; mouse healthspan studies used twice-weekly dosing over weeks to months"
  storage: "Refrigerate after reconstitution; use within 2–4 weeks"
  cycle_length: "4–8 weeks"
  break_between: "4 weeks"

pharmacokinetics:
  peak: "Not established in humans"
  half_life: "Not established in humans"
  cleared: "Not established in humans"

research_indications:
  - Neuroprotection against Alzheimer's-related toxicity (preclinical)
  - Apoptosis / cell-survival signaling (in vitro)
  - Metabolic healthspan and inflammation (animal models)
  - Longevity biomarker research (human observational studies)

reconstitution_steps:
  - Reconstitute with bacteriostatic water; refrigerate.

quality_indicators:
  - "White lyophilized powder that fully dissolves into a clear, colorless solution"
  - "Third-party COA available confirming peptide identity and purity"
  - "No visible discoloration, clumping, or particulate after reconstitution"

what_to_expect: >
  There is no established subjective effect profile in humans. The evidence base is primarily
  cell-culture, C. elegans, and mouse studies plus human observational data linking naturally
  higher circulating humanin to longevity; direct human trials of injected Humanin are lacking.

safety_notes: >
  Humanin has not been evaluated in human clinical safety trials. Most efficacy findings
  (neuroprotection, lifespan extension, metabolic improvement) come from cell culture, C. elegans,
  and rodent/primate studies, with human data limited to observational associations between
  endogenous levels and longevity. This is a research compound, not an approved treatment for
  any condition. Consult a healthcare provider.

