    dose: "2 mg (Egrifta) or 1.4 mg (Egrifta SV) once daily"
    timing: "Same time daily, subcutaneous injection into the abdomen"
    disclaimer: "Reflects FDA-approved dosing for HIV-associated lipodystrophy. Use only under medical supervision; not evaluated for other uses."
