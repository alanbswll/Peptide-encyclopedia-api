id: ovagen
name: Ovagen
status: draft

category_ids:
  - gut-health                 # no liver-specific category exists; "gut-health" is the closest
                                # available fit for a hepatic/gastrointestinal bioregulator.

overview: >
  A synthetic tripeptide from the Khavinson-school family of short "bioregulator" peptides,
  developed at the St. Petersburg Institute of Bioregulation and Gerontology and marketed as a
  liver and gastrointestinal-tract bioregulator, part of the same research program that produced
  Thymalin, Vilon, Cardiogen, and Livagen (Livagen itself is also targeted at liver/immune
  tissue — Ovagen is a separate, distinct product in the same commercial line). IMPORTANT: despite
  the name suggesting an ovarian/reproductive target, every Russian-language manufacturer and
  retail source found describes Ovagen as a liver/GI product ("для печени и ЖКТ"); the
  Khavinson-line product for ovarian and female reproductive tissue is a different, separately
  named preparation ("Zhenoluten"/Женолутен), not Ovagen. This encyclopedia entry documents
  Ovagen's actual, verified target (liver/GI), not the ovarian target implied by the compound
  name alone.

key_benefits:
  - Marketed by the originating institute as a liver and gastrointestinal-tract bioregulator
  - Part of the broader Khavinson "Cytogen" short-peptide product line alongside Vesugen,
    Crystagen, Cartalax, and Chonluten

aliases: []

mechanism_of_action: >
  Ovagen is proposed to act as a short-peptide "bioregulator" affecting gene expression in liver
  and gastrointestinal tissue, similar in concept to other Khavinson-group tripeptides. Vendor
  materials commonly cite the sequence Glu-Asp-Leu (EDL), though this was not independently
  confirmed against a peer-reviewed structural source, and no PubMed-indexed study using the trade
  name "Ovagen" was found (a search returned only unrelated results — a company name and street
  addresses that happen to contain the word "Ovagen"). A structurally identical or closely related
  tripeptide, tested under the laboratory code "T-35" rather than a trade name, has been reported
  in kidney tissue-culture studies to increase cell proliferation markers and reduce senescence
  markers, but that work does not establish a liver- or gut-specific effect. The precise molecular
  target and mechanism specific to Ovagen are not characterized in the independently verifiable
  literature.

