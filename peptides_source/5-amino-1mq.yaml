  cycle_length: "Not established from human data"
  break_between: "Not established from human data"

pharmacokinetics:
  peak: "Not established; no published human pharmacokinetic study exists"
  half_life: "Not established in humans; only preclinical (rodent) data has been published"
  cleared: "Not established in humans"

research_indications:
  - NNMT inhibition and adipocyte fat metabolism (preclinical, mouse models)
  - Body weight and fat mass reduction in diet-induced-obese mice (preclinical)
  - NAD+/SAM cellular metabolism support (preclinical rationale; not confirmed in humans)

reconstitution_steps:
  - Often supplied oral; follow supplier instructions.

quality_indicators:
  - "Third-party COA available confirming compound identity and purity, since this is sold as an unregulated research chemical"
  - "Capsule or raw powder should be free of unusual odor, discoloration, or clumping"

what_to_expect: >
  There is no published human data describing what to expect — every efficacy claim traces back
  to diet-induced-obese mouse studies. Any reported effects in humans are anecdotal. This is a
  meaningfully earlier-stage compound than the injectable GLP-1-class peptides in this category.

safety_notes: >
  5-Amino-1MQ has zero published human safety or efficacy data; it is not FDA-approved and has no
  history of human clinical trials. All available evidence comes from diet-induced-obese mouse
  models. It is sold as an unregulated research chemical, and typical "research dose" suggestions
  circulating online are extrapolated from rodent dosing rather than derived from any human study.
  Given the complete absence of human data, this compound should be treated as substantially more
  speculative than the GLP-1-class or growth-hormone-fragment peptides in this category. Consult
  a healthcare provider.

