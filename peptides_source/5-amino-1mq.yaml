id: 5-amino-1mq
name: 5-Amino-1MQ
status: published

category_ids:
  - fat-loss

overview: >
  A small molecule (not a peptide, despite being sold alongside peptides) that inhibits
  nicotinamide N-methyltransferase (NNMT), an enzyme highly expressed in fat tissue. It is
  explored for fat metabolism and NAD+/SAM support based entirely on preclinical (mouse) research
  — no published human trials exist as of this writing.

key_benefits:
  - Explored for fat metabolism and NAD+ support
  - Targets NNMT, an enzyme linked to adipocyte energy metabolism in mouse studies
  - Orally active in the research literature, unlike most injectable fat-loss peptides

mechanism_of_action: >
  NNMT methylates nicotinamide using S-adenosylmethionine (SAM) as the methyl donor, consuming
  both NAD+ precursor and SAM pools in adipose tissue. Elevated NNMT activity has been associated
  with obesity in preclinical models. 5-Amino-1MQ selectively and reversibly inhibits NNMT,
  which in diet-induced-obese mice raised intracellular SAM and NAD+, reduced adipocyte
  lipogenesis, and lowered body weight and fat mass without significantly changing food intake or
  lean mass.

