  peak: "Not well established in human pharmacokinetic literature"
  half_life: "Not well established in human pharmacokinetic literature"
  cleared: "Not well established in human pharmacokinetic literature"

research_indications:
  - T-cell differentiation and thymic/immune signaling research
  - Zinc-status research (serum thymulin bioactivity as a functional zinc-deficiency marker)
  - Immunosenescence / age-related decline in thymic output (preclinical and observational human research)

reconstitution_steps:
  - Reconstitute with bacteriostatic water; refrigerate.

quality_indicators:
  - "White lyophilized powder in a sealed vial"
  - "Clear, colorless solution after reconstitution with no visible particulate"
  - "Third-party COA available confirming peptide identity and purity, including confirmation of zinc content for the zinc-bound form"

what_to_expect: >
  Essentially all of thymulin's well-characterized effects come from laboratory immunology
  (T-cell marker) studies and zinc-status research, not from a self-administration model with a
  documented subjective effect profile. There is no established "what it feels like" timeline for
  at-home use.

safety_notes: >
  Zinc-thymulin/thymulin has a long research history (since the 1970s) but has never been
  developed into an FDA-approved drug, and there is no standardized human dosing or long-term
  safety data for self-administered use. Most available data comes from in vitro immunology
  assays, animal studies, and human serum-marker (not therapeutic-outcome) research. Because its
  activity is zinc-dependent, indiscriminate additional zinc supplementation alongside it carries
  the usual risks of zinc excess (copper deficiency, GI upset) if not dosed carefully. This is a
  research compound, not an approved treatment for any condition. Consult a healthcare provider.

