id: zinc-thymulin
name: Zinc-Thymulin
status: draft

category_ids:
  - immune

overview: >
  The zinc-bound, biologically active form of thymulin (originally called FTS, "Facteur Thymique
  Serique"), a nonapeptide hormone secreted exclusively by thymic epithelial cells. Discovered by
  Jean-Francois Bach and Mireille Dardenne in 1977, thymulin is unusual among peptide hormones in
  that it requires an equimolar zinc ion bound to its structure to be biologically active — the
  zinc-free peptide (apo-thymulin) is inactive. Research vendors market it as "Zinc-Thymulin" to
  emphasize that the metal-bound form is the one with immunological activity.

key_benefits:
  - Studied for T-cell differentiation and broader thymic/immune signaling
  - Serum thymulin activity is used in research as a sensitive marker of zinc nutritional status
  - Explored in aging research, since thymulin production declines with age alongside thymic involution

aliases:
  - "Thymulin"
  - "FTS"
  - "Facteur Thymique Serique"

mechanism_of_action: >
  Thymulin's nonapeptide sequence (pGlu-Ala-Lys-Ser-Gln-Gly-Gly-Ser-Asn) only adopts its
  biologically active conformation when bound to a zinc ion in an equimolar ratio; the zinc-free
  apopeptide does not induce the same T-cell effects. In its active, zinc-bound form, thymulin
  promotes intra- and extra-thymic T-cell differentiation and modulates markers of T-cell
  maturation. Because zinc availability directly gates thymulin's activity, serum thymulin
  bioactivity falls with zinc deficiency and can be restored with zinc repletion — a relationship
  used experimentally as a functional readout of zinc status. Thymulin/thymic output declines with
  age, and this decline has been linked in animal and human studies to reduced peripheral immune
  competence, which zinc supplementation has been explored as a way to partially reverse.

