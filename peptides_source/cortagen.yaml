id: cortagen
name: Cortagen
status: draft

category_ids:
  - cognitive

overview: >
  A synthetic tetrapeptide (Ala-Glu-Asp-Pro) from the Khavinson-school family of short
  "bioregulator" peptides, developed at the St. Petersburg Institute of Bioregulation and
  Gerontology as the synthesized short-peptide counterpart to Cortexin, an older natural
  cattle-brain-cortex extract used in Russian clinical practice since the 1980s. Cortagen is part
  of the same research program that produced Thymalin, Vilon, Cardiogen, and Livagen; its
  supporting research comes almost entirely from Khavinson-affiliated studies.

key_benefits:
  - Studied in ischemic rats for accelerating recovery of disturbed behavior and limiting
    oxidative stress in brain tissue
  - Explored via microarray for effects on gene expression in mouse heart tissue, identifying
    over 100 genes with altered expression after treatment
  - Investigated alongside Cortexin as a combination approach for chronic cerebral ischemia in
    Russian clinical pharmacology literature

aliases: []

mechanism_of_action: >
  Cortagen is proposed to act as a short-peptide "bioregulator" affecting gene expression in
  cerebral cortex tissue, similar in concept to other Khavinson-group tetrapeptides. In rat
  models of cerebral ischemia with varying resistance to hypoxia, Cortagen (alongside the related
  natural extract Cortexin) accelerated recovery of disturbed individual behavior and prevented
  excessive lipid peroxidation while preserving antioxidant activity in brain tissue. A separate
  microarray study in mice found that five days of Cortagen administration altered expression of
  234 gene probes (corresponding to 110 known genes) in heart tissue — a cross-tissue gene
  expression effect rather than a brain-specific one, illustrating the broad, not strictly
  organ-limited, transcriptional effects reported for these short peptides. The precise molecular
  target and mechanism are not well-characterized outside this research program, and no human
  clinical trial data specific to Cortagen was found.

