  - Reconstitute with bacteriostatic water; refrigerate.

quality_indicators:
  - "White to off-white lyophilized powder that fully dissolves into a clear solution"
  - "Third-party COA available confirming peptide identity and purity"
  - "No visible discoloration, clumping, or particulate after reconstitution"

what_to_expect: >
  There is no established human effect profile for Cardiogen. Virtually all available evidence
  is from organotypic tissue-culture studies of rat myocardium conducted by researchers
  affiliated with Vladimir Khavinson's institute; no human trials or independent replications by
  research groups outside that program were found.

safety_notes: >
  Cardiogen's evidence base is limited almost entirely to tissue-culture and animal studies
  published by Vladimir Khavinson's research group and collaborators, largely in
  lower-circulation or Russian-language journals. There is no independent human safety or
  efficacy data. This is an experimental research compound with unverified relevance to humans,
  not an approved treatment for any cardiac or other condition. Consult a healthcare provider.

