id: cardiogen
name: Cardiogen
status: published

category_ids:
  - longevity

overview: >
  A synthetic tetrapeptide (Ala-Glu-Asp-Arg) developed by Vladimir Khavinson's group at the St.
  Petersburg Institute of Bioregulation and Gerontology as a tissue-specific "bioregulator"
  targeting cardiac tissue, part of the same research program that produced Thymalin and Vilon.
  Cardiogen's supporting research comes almost entirely from Khavinson-affiliated studies.

key_benefits:
  - Studied for cardiomyocyte proliferation in aged tissue culture
  - Explored alongside other Khavinson-group tetrapeptides for tissue-specific bioregulation research

mechanism_of_action: >
  Cardiogen is proposed to act as a short-peptide "bioregulator" affecting gene expression in
  cardiac tissue, similar in concept to other Khavinson-group tetrapeptides. In organotypic
  tissue culture of myocardial explants from young and old rats, picomolar concentrations of
  Cardiogen stimulated cardiomyocyte proliferation and were associated with decreased expression
  of the p53 protein — an effect not reproduced by any of the 20 individual amino acids tested
  in the same study, suggesting the activity depends on the intact tetrapeptide sequence. The
  precise molecular target and mechanism are not well-characterized outside this research
  program, and no human clinical trial data was found.

